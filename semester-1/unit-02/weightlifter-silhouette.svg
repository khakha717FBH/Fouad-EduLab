<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300" role="img" aria-labelledby="liftTitle">
  <title id="liftTitle">رافع أثقال من الجانب، مرفقه مثنيّ: عضده يهبط من كتفه إلى مرفقه، وساعده يصعد من المرفق إلى البار أمامه</title>
  <!--
    ظلّية المحطة 1 — مختبر فؤاد التعليمي · الوحدة 02 · الدرس 04
    ═══════════════════════════════════════════════════════════
    شرط الرسم الحاكم: مفصل المرفق مقروء — وهو محور الدرس كلّه.
    وثلاث نسخ سقطت قبل هذه، ولكلٍّ سببها:

    (1) الذراعان ممدودتان فوق الرأس: العضد والساعد بميل واحد
        فقُرئا عظمًا مستقيمًا واحدًا، ولا مرفق فيه أصلًا.
    (2) منظر أماميّ: الذراعان أمام الجذع فانطبقتا عليه واختفتا.
    (3) منظر جانبيّ والمرفق منطبق على الصدر: قُرئت الذراع حرفًا
        مرسومًا على القميص لا طرفًا أمامه.

    والعلاج هنا ثلاثة معًا: منظر جانبيّ · ومرفق يتقدّم أمام
    كفاف الجذع فيقع كلّه في الفراغ · وزاوية 60 درجة عند المرفق
    فلا تنطبق القطعتان إحداهما على الأخرى.

    والمنظر الجانبيّ هو منظر مسرح المحطة 3 نفسه، فيعبر الطالب من
    الصورة إلى المسرح بلا تبديل زاوية نظر. والوضع مقصود تربويًّا:
    المحطة تطلب منه أن يثني ساعده ويمدّه، فالصورة تُري الفعل
    نفسه الذي سيؤدّيه.

    النِّسَب: القامة 7.5 رأس. والعضد 47 وحدة والساعد 37، وهي
    نسبة الذراع الحقيقية تقريبًا. والنسخة الأولى كانت 5.7 رأس
    وأكتافها 1.6 رأس، فخرجت الذراعان من وسط الصدر بلا كتفين.

    الأطراف كتلٌ ذات كفاف متّصل لا مستطيلات تعلوها دوائر عند
    المفاصل: الدوائر كانت تُقرأ خرزات فيُقرأ الجسد آليًّا. ودائرة
    المرفق هنا داخل الكتلتين وبلون الطرف نفسه، فتُدوّر الزاوية
    ولا تُرى بذاتها.

    والحدّ حول الطرفين القريبين بلون خلفية البطاقة: ظلّيةٌ بلونٍ
    واحد لا تفصل طرفًا عن جذعٍ خلفه، والفصل يقع بالفراغ لا بلونٍ
    ثالث يُدخل معنًى لا نريده.

    ولا قوس حركة ولا سهم ولا تظليل على عضلة: المحطة تسأل الطالب
    أين يشعر بالشدّ وكم عضلة عملت، فرسمُ الكتلة العاملة يجيب عن
    السؤالين قبل أن يُطرحا. الظلّية تُري الوضع لا السبب.

    بلا لوحة خلفية ولا حدّ خارجي: الصورة تعيش داخل بطاقة في
    الدرس، فحدّها الخاصّ كان يُنتج حدًّا داخل حدّ.
  -->
  <defs>
    <linearGradient id="liftFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1FD9B6"/>
      <stop offset="1" stop-color="#0E8F79"/>
    </linearGradient>
  </defs>

  <!-- الأرض -->
  <ellipse cx="150" cy="258" rx="76" ry="7" fill="#14C8A8" opacity=".10"/>

  <!-- الحلقات الأولمبية خلف الرافع: إشارة إلى ريو 2016 بلا شعار ولا نصّ -->
  <g fill="none" stroke="#14C8A8" stroke-width="3.5" opacity=".12">
    <circle cx="70" cy="56" r="14"/>
    <circle cx="100" cy="56" r="14"/>
    <circle cx="130" cy="56" r="14"/>
    <circle cx="85" cy="69" r="14"/>
    <circle cx="115" cy="69" r="14"/>
  </g>

  <!-- ═══ الطرفان البعيدان: أبهت ومزاحان إلى الخلف، فيُقرأ العمق ═══ -->
  <g fill="url(#liftFill)" opacity=".42">
    <path d="M 157,166 Q 157,189 150,207 Q 152,229 150,242
             L 169,244 Q 172,250 167,253
             L 132,253 Q 128,249 132,242
             Q 137,228 134,207 Q 128,190 131,166 Z"/>
    <path d="M 140.2,79.2 L 160.2,122.2 L 173.8,115.8 L 153.8,72.8 Z"/>
    <circle cx="167" cy="119" r="7.5"/>
    <path d="M 171.9,123.3 L 200.9,90.3 L 191.1,81.7 L 162.1,114.7 Z"/>
    <rect x="188" y="79" width="17" height="13" rx="6"/>
  </g>

  <!-- ═══ الجذع والرأس ═══ -->
  <g fill="url(#liftFill)">
    <!-- الرأس: قمّته y=28 وذقنه y=56 -->
    <circle cx="150" cy="42" r="14"/>
    <!-- الرقبة: ترفع الرأس عن خطّ الكتفين فيبقى الكتف مقروءًا -->
    <path d="M 143,54 L 157,54 L 156,69 L 142,69 Z"/>

    <!-- الجذع: كفاف واحد — ظهرٌ مقوّس وصدرٌ بارز وخصرٌ يضيق -->
    <path d="M 137,69
             Q 126,100 130,142
             L 172,142
             Q 177,101 168,71
             Q 152,62 137,69 Z"/>

    <!-- الحوض -->
    <path d="M 130,142 L 172,142 L 173,166 Q 151,172 129,166 Z"/>
  </g>

  <!-- ═══ الساق القريبة ═══ -->
  <g fill="url(#liftFill)" stroke="#131c30" stroke-width="3" stroke-linejoin="round">
    <path d="M 166,166 Q 166,189 159,207 Q 161,229 159,242
             L 178,244 Q 181,250 176,253
             L 141,253 Q 137,249 141,242
             Q 146,228 143,207 Q 137,190 140,166 Z"/>
  </g>

  <!-- ═══ البار وقرصه: أمام كفاف الجذع كلّه فلا يحجبه ولا يحجبُه ═══ -->
  <circle cx="228" cy="80" r="21" fill="#14C8A8" opacity=".18"/>
  <circle cx="228" cy="80" r="21" fill="none" stroke="#14C8A8" stroke-width="6" opacity=".65"/>
  <!-- قضيب البار: يخرج من القبضة إلى مركز القرص، فتُقرأ اليد قابضةً
       على شيء. وبدونه كانت اليد تقع فوق القرص فتبدو ممسكةً به. -->
  <rect x="200" y="76" width="32" height="7" rx="3.5" fill="#14C8A8" opacity=".6"/>
  <circle cx="228" cy="80" r="5" fill="#14C8A8" opacity=".8"/>

  <!-- ═══ الذراع القريبة: مرسومة آخرًا فتظهر أمام الجذع والقرص ═══
       العضد من الكتف (156,74) إلى المرفق (176,117): يهبط ويتقدّم.
       والساعد من المرفق إلى القبضة (205,84): يصعد ويتقدّم.
       الانكسار بينهما — 60 درجة — هو موضع القراءة كلّه. -->
  <g fill="url(#liftFill)" stroke="#131c30" stroke-width="3" stroke-linejoin="round">
    <path d="M 149.2,77.2 L 169.2,120.2 L 182.8,113.8 L 162.8,70.8 Z"/>
    <circle cx="176" cy="117" r="7.5"/>
    <path d="M 180.9,121.3 L 209.9,88.3 L 200.1,79.7 L 171.1,112.7 Z"/>
    <rect x="197" y="77" width="17" height="13" rx="6"/>
  </g>
</svg>
